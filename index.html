<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irrealm - Особиста цифрова бібліотека</title>
    
    <!-- Підключаємо наші стилі -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="header__logo">Irrealm</div>
        <nav class="nav">
            <a href="#" class="nav__link nav__link--active">Бібліотека</a>
            <a href="#" class="nav__link">Статистика</a>
            <a href="#" class="nav__link">Профіль</a>
        </nav>
    </header>

    <!-- ОСНОВНИЙ КОНТЕНТ (Сюди main.js вставить картки) -->
<main style="min-height: calc(100vh - 200px);">
    <!-- Панель інструментів (Пошук та Фільтри) -->
    <div style="padding: 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--color-border);">
        
        <!-- Пошук -->
        <div class="field" style="flex-grow: 1; max-width: 300px;">
            <input type="text" id="searchInput" class="field__input" placeholder="Пошук за назвою чи нотаткою...">
        </div>

        <!-- Кнопки категорій (з data-атрибутами для зручності) -->
        <div id="categoryFilters" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="button button--primary" data-category="">Всі</button>
            <button class="button button--ghost" data-category="Гра">Ігри</button>
            <button class="button button--ghost" data-category="Курс">Курси</button>
            <button class="button button--ghost" data-category="Книга">Книги</button>
            <button class="button button--ghost" data-category="Фільм">Фільми</button>
        </div>
        
    </div>

    <!-- Контейнер для карток -->
    <div id="catalogContainer"></div>
</main>

    <!-- Підвал сайту -->
    <footer class="footer">
        <p class="footer__text">© 2026 Irrealm. Усі права захищено.</p>
        <a href="#" class="footer__link">Умови використання</a>
    </footer>

    <!-- Підключаємо головний скрипт як модуль -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
